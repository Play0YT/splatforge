name: Core

on:
  push:
    branches: [main]
    paths: ["packages/core/**", "packages/job-schema/**", "pyproject.toml", "uv.lock", ".github/workflows/core.yml"]
  pull_request:
    paths: ["packages/core/**", "packages/job-schema/**", "pyproject.toml", "uv.lock", ".github/workflows/core.yml"]

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
      - run: uv sync --all-packages --locked
      - run: uv run ruff check packages/core
      - run: uv run ruff format --check packages/core
      - run: uv run mypy packages/core/src

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Maskierungsmodelle (ca. 240 MB) einmal laden und zwischenspeichern
      SPLATFORGE_MODELS_DIR: ${{ github.workspace }}/.ci-models
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
      - name: FFmpeg installieren (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: FFmpeg installieren (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: FFmpeg installieren (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: uv sync --all-packages --locked
      # Für das CPU-Backend genügt das kleine CPU-Paket von PyTorch (ohne CUDA).
      - run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Maskierungsmodelle aus dem Zwischenspeicher
        uses: actions/cache@v6
        with:
          path: .ci-models
          key: mask-models-${{ hashFiles('packages/core/src/splatforge/models.py') }}
          enableCrossOsArchive: true
      - name: Maskierungsmodelle laden bzw. prüfen
        run: uv run --no-sync splatforge models --download rtdetr-r18 sam2.1-tiny
      - name: Unit-Tests
        working-directory: packages/core
        run: uv run --no-sync pytest -m "not integration" -q
      - name: Integrationstest (kompletter Durchlauf auf CPU)
        working-directory: packages/core
        run: uv run --no-sync pytest -m integration -q
