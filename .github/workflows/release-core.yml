name: Release Core

# Ein Tag der Form core-v<Version> (z. B. core-v0.1.3) erstellt ein GitHub-Release mit dem
# Changelog-Abschnitt dieser Version und dem gebauten Python-Paket.
on:
  push:
    tags: ["core-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # alle Tags, um das vorherige Release zu finden
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
      - name: Version prüfen und Release-Text erzeugen
        env:
          TAG: ${{ github.ref_name }}
        run: uv run --no-project python .github/scripts/release_notes.py "$TAG" packages/core > notes.md
      - name: Paket bauen
        run: uv build --package splatforge --out-dir dist
      - name: Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "SplatForge Core ${TAG#core-v}" --notes-file notes.md
