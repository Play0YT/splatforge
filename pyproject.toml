[tool.uv.workspace]
members = ["packages/core"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PTH", "S603", "S604", "S605", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["splatforge", "conftest", "synthetic"]

[tool.ruff.lint.per-file-ignores]
"packages/core/tests/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

# Die Typ-Stubs von OpenCV sind für die Python-Aufrufe zu streng und widersprüchlich.
[[tool.mypy.overrides]]
module = ["cv2", "cv2.*"]
follow_imports = "skip"
