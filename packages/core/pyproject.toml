[project]
name = "splatforge"
version = "0.1.3"
description = "SplatForge Core: Video zu 3D Gaussian Splat (Pipeline und CLI, ohne UI und HTTP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13,<3",
    "numpy>=2.0,<3",
    "opencv-python-headless>=4.10",
    "pycolmap>=4.2,<5",
]

[project.optional-dependencies]
# Ausweich-Backend fuer reines CPU-Training (langsam). Siehe docs/decisions/0002-cpu-trainingsbackend.md
cpu-train = ["torch>=2.4"]

[project.scripts]
splatforge = "splatforge.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "jsonschema>=4.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/splatforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: kompletter Pipeline-Durchlauf (langsam)"]

